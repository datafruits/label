image: node:22

stages:
  - deploy

pages:
  stage: deploy
  variables:
    OUTPUT_DIR: public
    PRESERVE_OUTPUT: "1"
    PUBLIC_ORIGIN: "https://releases.datafruits.fm"
    PAGES_CNAME: "releases.datafruits.fm"
  script:
    - npm run build:gitlab
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
